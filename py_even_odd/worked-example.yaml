runtime:
  language: python
  version: 3
statement: |
  Determine if a number is **even** or **odd** using conditional statements and the modulus operator. This worked example covers:
  - Reading numeric inputs
  - Checking remainders using the modulus operator `%`
  - Conditional branch execution using `if / else`
executions:
  - title: Input 4
    stdin:
      - 4
    stdout: |-
      Enter a number: 4
      This number is even
    console: |-
      Enter a number: 4
      This number is even
    status: pass
elements:
  - type: explanation
    location:
      snippet: "if n % 2 == 0:"
    explanations:
      - body: |
          The modulus operator `%` returns the division remainder. Dividing an even number by `2` leaves a remainder of `0` (`n % 2 == 0`). If the remainder is non-zero, it is odd.
