$schema: https://learning-contents.org/schemas/worked-example/0.1.0
source: main.py
license: MIT
locale: en-US
id: we_swap_vars
title: Swapping Variables
description: Demonstrate tuple unpacking to swap two variables.
authors:
  - first: Alice
    last: Smith
    email: alice.smith@edu.com
    affiliation: Independent researchers
pedagogy:
  activity: worked-example
  difficulty: novice
  topics:
    - variables
    - tuple unpacking
  prereq_topics: []
runtime:
  language: python
  version: 3
statement: |
  Learn how to swap the values of two variables without using a temporary variable. This worked example covers:
  - Parallel variable assignment
  - Tuple creation and unpacking syntax
executions:
  - title: Standard run
    stdout: "a: 20, b: 10"
    console: "a: 20, b: 10"
    status: pass
elements:
  - type: explanation
    location:
      snippet: a, b = b, a
    explanations:
      - body: |
          This single line `a, b = b, a` swaps the values of `a` and `b`. Python evaluates the right-hand side first, creating a temporary tuple `(b, a)` in memory, and then unpacks it into the variables `a` and `b` on the left-hand side.
