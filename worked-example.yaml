statement: |
  This worked example demonstrates how `BankAccount` state and operations are modeled in Python using object-oriented classes and methods. We'll examine:
  1. The `BankAccount` class declaration and constructor initialization (`__init__`) using `self`.
  2. The `deposit` method with positive input validation and f-string output.
  3. The `withdraw` method with compound guard logic protecting against overdrafts.
  4. Script execution demonstrating object instantiation, method calls, and attribute inspection.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Demonstrates the step-by-step execution and final state of the bank account transactions."
elements:
  - type: explanation
    location:
      snippet: |-
        class BankAccount:
          def __init__(self, owner, balance):
            self.owner = owner
            self.balance = balance
    explanations:
      - body: |
          ### 1. Class Definition and Constructor (`__init__`)
          * `class BankAccount:` defines the class blueprint for bank account objects in Python.
          * `def __init__(self, owner, balance):` is the special initializer method (constructor) automatically called when creating a new instance via `BankAccount(...)`.
          * In Python, `self` explicitly represents the instance being created or operated upon.
          * `self.owner = owner` and `self.balance = balance` bind the provided argument values to attributes on the instance.
  - type: explanation
    location:
      snippet: |2-

          def deposit(self, amount):
            if amount > 0:
              self.balance = self.balance + amount
              print(f"Deposited {amount}")
            return self.balance
    explanations:
      - body: |
          ### 2. The `deposit` Method
          * **Input Guard**: `if amount > 0:` validates that only positive values can be deposited, preventing negative or zero amounts from altering account state.
          * **State Mutation**: `self.balance = self.balance + amount` increments the instance's `balance` attribute by the deposit `amount`.
          * **Formatted Output**: `print(f"Deposited {amount}")` uses Python f-string formatting to print transaction feedback.
          * **Return Value**: `return self.balance` returns the updated balance to the caller.
  - type: explanation
    location:
      snippet: |2-

          def withdraw(self, amount):
            if 0 < amount and amount <= self.balance:
              self.balance = self.balance - amount
              print(f"Withdrew {amount}")
            else:
              print("Insufficient funds")
            return self.balance
    explanations:
      - body: |
          ### 3. The `withdraw` Method and Overdraft Protection
          * **Compound Guard Condition**: `if 0 < amount and amount <= self.balance:` validates two rules using the `and` operator:
            1. `0 < amount`: The requested withdrawal must be positive.
            2. `amount <= self.balance`: The requested amount must not exceed current funds (allowing full withdrawals down to 0).
          * **Successful Debit**: When valid, `self.balance = self.balance - amount` deducts funds and prints confirmation.
          * **Fallback Branch**: The `else:` block catches overdraft attempts or invalid amounts by printing `"Insufficient funds"` without modifying `self.balance`.
          * **Return Value**: Returns the current balance in all cases.
  - type: explanation
    location:
      snippet: |-
        account = BankAccount("Bob", 200)
        account.deposit(100)
        account.withdraw(50)
        print(f"Balance: {account.balance}")
    explanations:
      - body: |
          ### 4. Instantiation and Method Invocations
          * `account = BankAccount("Bob", 200)`: Instantiates a `BankAccount` object for `"Bob"` with an initial balance of `200`.
          * `account.deposit(100)`: Invokes the `deposit` method on `account`, increasing balance to `300` and printing `"Deposited 100"`.
          * `account.withdraw(50)`: Invokes `withdraw`, decreasing balance to `250` and printing `"Withdrew 50"`.
          * `print(f"Balance: {account.balance}")`: Accesses the `account.balance` attribute directly to print the final result (`"Balance: 250"`).
