id: cc_dict_lookup
title: Dictionary Secret
description: Accessing values in a dictionary.
authors:
  - first: Fiona
    last: Gallagher
    email: fiona@shameless.com
    affiliation: Independent researchers
pedagogy:
  activity: code-completion
  difficulty: intermediate
  topics:
    - dictionaries
    - keys
  prereq_topics: []
runtime:
  language: python
  version: 3
statement: |
  Complete the code to lookup the score associated with the `name` variable inside the `scores` dictionary.
  Pay attention to bracket notations!
executions:
  - title: Access Alice
    stdout: "Alice's score is: 90"
    console: "Alice's score is: 90"
    status: pass
elements:
  - type: blank
    location:
      snippet: scores[name]
    choices:
      - snippet: scores[name]
        role: solution
        explanations:
          - body: |
              Correct! In Python, dictionary value lookups always use square brackets `[]` enclosing the key name.
      - snippet: scores(name)
        role: distractor
        explanations:
          - body: |
              Using parentheses `()` invokes a function call. Since `scores` is a dictionary and not a function, this throws a `TypeError: 'dict' object is not callable`.
