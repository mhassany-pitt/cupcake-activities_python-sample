question: |
  Given the following Python class skeleton for `BankAccount`:
  
  ```python
  class BankAccount:
      def __init__(self, owner, balance):
          self.owner = owner
          self.balance = balance
  ```
  
  Which of the following represents the correct implementation for a `deposit` method in Python that validates that `amount > 0`, adds the amount to the instance's balance, and returns the new balance?
hints:
  - "Remember that instance methods in Python require `self` as the first parameter to access and mutate instance attributes like `self.balance`."
  - "Ensure you accumulate the deposit into the balance (`self.balance += amount`) rather than overwriting it or modifying an unbound local variable."
choices:
  - body: |
      ```python
      def deposit(self, amount):
          if amount > 0:
              self.balance += amount
              return self.balance
          raise ValueError("Deposit amount must be positive")
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Includes `self` as the first parameter to reference the instance.
          2. Validates that `amount > 0`.
          3. Correctly mutates the instance attribute using `self.balance += amount`.
          4. Returns the updated balance and raises a `ValueError` for invalid amounts.
  - body: |
      ```python
      def deposit(amount):
          if amount > 0:
              balance = balance + amount
              return balance
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Python, instance methods must declare `self` as their first parameter. Furthermore, modifying a local `balance` variable without `self.` fails to update the instance attribute.
  - body: |
      ```python
      def deposit(self, amount):
          if amount > 0:
              self.balance =+ amount
              return self.balance
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`self.balance = +amount`), which overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```python
      def deposit(self, amount):
          if amount > 0:
              balance += amount
              return balance
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Python instance methods, instance attributes must be referenced with the `self.` prefix (`self.balance`). Referencing `balance += amount` without `self.` causes an `UnboundLocalError: local variable 'balance' referenced before assignment`.