$schema: https://learning-contents.org/schemas/code-completion/0.1.0
source: main.py
license: MIT
locale: en-US
id: cc_func_greet
title: Functional Greetings
description: Defining and calling functions.
authors:
  - first: Helena
    last: Ravenclaw
    email: helena@hogwarts.uk
    affiliation: Independent researchers
pedagogy:
  activity: code-completion
  difficulty: intermediate
  topics:
    - functions
    - arguments
  prereq_topics: []
runtime:
  language: python
  version: 3
statement: |
  Complete the function header to define the `say_hi` function so that it accepts a `name` parameter.
  Remember the keyword used for function definition in Python!
executions:
  - title: Greet Sarah
    stdout: Hi Sarah!
    console: Hi Sarah!
    status: pass
elements:
  - type: blank
    location:
      snippet: "def say_hi(name):"
    choices:
      - snippet: "def say_hi(name):"
        role: solution
        explanations:
          - body: |
              Correct! Python functions are defined using the `def` keyword followed by the function name, parameters in parentheses, and a colon.
      - snippet: "function say_hi(name):"
        role: distractor
        explanations:
          - body: |
              The `function` keyword is used in JavaScript, TypeScript, and PHP, but is not valid syntax in Python.
