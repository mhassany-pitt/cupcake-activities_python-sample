    affiliation: Independent researchers
pedagogy:
  activity: worked-example
  difficulty: intermediate
  topics:
    - functions
    - arguments
  prereq_topics: []
runtime:
  language: python
  version: 3
statement: |
  Learn how to define a reusable function and invoke it with a string argument in Python. This worked example covers:
  - Declaring functions using the `def` keyword
  - Specifying positional parameters
  - Calling functions and passing custom arguments
executions:
  - title: Greet Sarah
    stdout: Hi Sarah!
    console: Hi Sarah!
    status: pass
elements:
  - type: explanation
    location:
      snippet: "def say_hi(name):"
    explanations:
      - body: |
          The `def` keyword begins a function definition. Here, `name` is a parameter—a local variable that acts as a placeholder for the input argument passed when calling the function.
