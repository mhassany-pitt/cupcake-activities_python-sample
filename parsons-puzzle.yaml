$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: main.py
title: Bank Account Methods and Constructor in Python
description: Rearrange the Python methods and constructor to properly manage BankAccount instance state and enforce transaction safety.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - conditional-logic
    - variable-scope
runtime:
  language: python
  version: 3.1
statement: |
  Rearrange the blocks to correctly implement the constructor and methods for the `BankAccount` class in Python.
  Make sure to:
  1. Initialize instance attributes (`self.owner` and `self.balance`) using `self`.
  2. Implement the `deposit` method with positive input validation.
  3. Implement the `withdraw` method with strict overdraft protection and insufficient funds notification.
hints:
  - "Arrange the code blocks in logical sequential order from initialization to final output."
  - "Ensure correct block indentation where applicable."
testcases:
  - title: Standard Transaction
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Correct! All blocks are sequenced properly to produce the expected output."
      on_fail:
        - "The block ordering or indentation is incorrect. Re-examine the flow of execution."
elements:
  - type: block
    group: bank-members
    location:
      snippet: |2-
          def __init__(self, owner, balance):
            self.owner = owner
            self.balance = balance
    choices:
      - snippet: |2-
            def __init__(self, owner, balance):
              self.owner = owner
              self.balance = balance
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Uses `self.owner = owner` and `self.balance = balance` to bind constructor argument values to attributes on the instance.
      - snippet: |-
          def __init__(self, owner, balance):
            owner = owner
            balance = balance
        role: distractor
        explanations:
          - body: |
              Incorrect. Without `self.`, `owner = owner` assigns parameters back to local variables, leaving the instance without `owner` and `balance` attributes.
  - type: block
    group: bank-members
    location:
      snippet: |2-
          def deposit(self, amount):
            if amount > 0:
              self.balance = self.balance + amount
              print(f"Deposited {amount}")
            return self.balance
    choices:
      - snippet: |2-
            def deposit(self, amount):
              if amount > 0:
                self.balance = self.balance + amount
                print(f"Deposited {amount}")
              return self.balance
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Validates that `amount > 0` before updating `self.balance`, prints confirmation, and returns the updated balance.
  - type: block
    group: bank-members
    location:
      snippet: |2-
          def withdraw(self, amount):
            if 0 < amount and amount <= self.balance:
              self.balance = self.balance - amount
              print(f"Withdrew {amount}")
            else:
              print("Insufficient funds")
            return self.balance
    choices:
      - snippet: |2-
            def withdraw(self, amount):
              if 0 < amount and amount <= self.balance:
                self.balance = self.balance - amount
                print(f"Withdrew {amount}")
              else:
                print("Insufficient funds")
              return self.balance
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Verifies `0 < amount and amount <= self.balance`, debits the account when funds are sufficient, prints an error message when funds are insufficient, and returns `self.balance`.
      - snippet: |-
          def withdraw(self, amount):
            self.balance = self.balance - amount
            print(f"Withdrew {amount}")
            return self.balance
        role: distractor
        explanations:
          - body: |
              Incorrect. Unconditionally deducts `amount` without verifying if `amount <= self.balance`, allowing the account balance to become negative.
