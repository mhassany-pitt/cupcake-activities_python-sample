$schema: https://learning-contents.org/schemas/code-completion/0.1.0
source: main.py
license: MIT
locale: en-US
id: cc_sum_numbers
title: Adding Two Numbers
description: Tests inputs and integer conversion.
authors:
  - first: Bob
    last: Johnson
    email: bob.j@tech.io
    affiliation: Independent researchers
pedagogy:
  activity: code-completion
  difficulty: novice
  topics:
    - input
    - int
    - arithmetic
  prereq_topics: []
runtime:
  language: python
  version: 3
statement: |
  Complete the program to correctly read two numbers from the user and print their sum.
  Remember that standard input reads values as strings by default!
executions:
  - title: Result of 5 + 7
    stdin:
      - 5
      - 7
    stdout: |-
      Enter first number: 5
      Enter second number: 7
      The sum is: 12
    console: |-
      Enter first number: 5
      Enter second number: 7
      The sum is: 12
    status: pass
elements:
  - type: blank
    location:
      snippet: "x = int(input(\"Enter first number: \"))"
    choices:
      - snippet: "x = int(input(\"Enter first number: \"))"
        role: solution
        explanations:
          - body: |
              Correct! Wrapping `input()` inside `int()` converts the text input to an integer, allowing arithmetic addition.
      - snippet: "x = input(\"Enter first number: \")"
        role: distractor
        explanations:
          - body: |
              This leaves the input as a string type. In Python, adding strings concatenates them (e.g., `"5" + "7"` results in `"57"` rather than `12`).
