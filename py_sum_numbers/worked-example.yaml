$schema: https://learning-contents.org/schemas/worked-example/0.1.0
source: main.py
license: MIT
locale: en-US
id: we_sum_numbers
title: Adding Two Numbers
description: Demonstrate inputs and integer conversion.
authors:
  - first: Bob
    last: Johnson
    email: bob.j@tech.io
    affiliation: Independent researchers
pedagogy:
  activity: worked-example
  difficulty: novice
  topics:
    - input
    - int
    - arithmetic
  prereq_topics: []
runtime:
  language: python
  version: 3
statement: |
  Learn how to take numeric input from the user and perform addition. This worked example covers:
  - Reading text inputs using `input()`
  - Converting text to integers using `int()`
  - Computing and printing the sum
executions:
  - title: Result of 5 + 7
    stdin:
      - 5
      - 7
    stdout: |-
      Enter first number: 5
      Enter second number: 7
      The sum is: 12
    console: |-
      Enter first number: 5
      Enter second number: 7
      The sum is: 12
    status: pass
elements:
  - type: explanation
    location:
      snippet: "x = int(input(\"Enter first number: \"))"
    explanations:
      - body: |
          The `input()` function returns a string value. We must wrap it in `int()` to convert it to an integer so that arithmetic operations (like `+`) perform math addition instead of string concatenation.
