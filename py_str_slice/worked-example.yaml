    location:
      snippet: "text[:6]"
    explanations:
      - body: |
          The slice syntax `[:6]` is shorthand for `[0:6]`. This takes characters from start index `0` up to (but not including) index `6`, resulting in indices `0, 1, 2, 3, 4, 5`.
