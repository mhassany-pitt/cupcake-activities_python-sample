statement: |
  Implement a `transfer` method to move money from one `BankAccount` to another.
  The method signature should be:
  ```python
  def transfer(self, target_account, amount):
      # Your implementation here
  ```
  Ensure that money is withdrawn from the current account only if funds are sufficient, and deposited into the target account.
