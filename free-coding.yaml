$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: main.py
license: MIT
locale: en-US
id: free_coding_bank_account
title: Bank Account Management in Python
description: Instantiate a BankAccount object, execute deposit and withdrawal transactions, and inspect the resulting balance.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - state
runtime:
  language: python
  version: 3
statement: |
  Write the Python code to interact with the `BankAccount` class:
  1. Instantiate a new `BankAccount` named `account` for owner `"Bob"` with an initial balance of `200`.
  2. Call `deposit` with an amount of `100`.
  3. Call `withdraw` with an amount of `50`.
  4. Print the final balance to the console in the format: `Balance: <balance>`.
hints:
  - "Review the problem statement and ensure the steps are executed in order."
  - "Verify that initial values, deposits, withdrawals, and prints match the specification."
elements:
  - type: locked
    location:
      snippet: |-
        class BankAccount:
          def __init__(self, owner, balance):
            self.owner = owner
            self.balance = balance

          def deposit(self, amount):
            if amount > 0:
              self.balance = self.balance + amount
              print(f"Deposited {amount}")
            return self.balance

          def withdraw(self, amount):
            if 0 < amount and amount <= self.balance:
              self.balance = self.balance - amount
              print(f"Withdrew {amount}")
            else:
              print("Insufficient funds")
            return self.balance
  - type: editable
    location:
      snippet: |-
        account = BankAccount("Bob", 200)
        account.deposit(100)
        account.withdraw(50)
        print(f"Balance: {account.balance}")
    placeholder: |-
      # 1. Create a BankAccount for "Bob" with 200 initial balance
      # 2. Deposit 100
      # 3. Withdraw 50
      # 4. Print `Balance: {account.balance}`
testcases:
  - title: Standard Account Workflow
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Great job! Your solution executed properly and matched all expected outputs."
      on_fail:
        - "Your code produced differing output. Double-check your method calls and printed formatting."
  - title: Balance Calculation Check
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Verified! Your deposit and withdrawal sequence calculated the balance accurately."
      on_fail:
        - "Calculation check failed. Check that deposit is called with 100 and withdraw with 50."
  - title: Hidden Output Formatting Test
    visible: false
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Hidden validation passed! All output strings strictly conform to specification."
      on_fail:
        - "Hidden validation failed. Verify string case and spaces in printed output."
