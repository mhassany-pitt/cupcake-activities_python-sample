$schema: https://learning-contents.org/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bool_logic
source: main.py
title: Raining and Umbrellas
description: Arrange the code blocks to correctly determine if you should stay inside.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of Pittsburgh
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics: [variables, print]
  topics: [variables, print, boolean logic, conditionals]
runtime:
  language: python
  version: 3.10
statement: |
  Rearrange the blocks to correctly implement the weather logic.
  Make sure to check if it is raining AND you don't have an umbrella before deciding to stay inside.
executions:
  - title: Default case (Raining, No Umbrella)
    stdout: Stay inside
    console: Stay inside
elements:
  - type: block
    location:
      snippet: |-
        if is_raining and not has_umbrella:
          print("Stay inside")
    choices:
      - snippet: |-
          if is_raining and not has_umbrella:
            print("Stay inside")
          return self.balance
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! This checks both conditions correctly using `and` and `not`.
      - snippet: |-
          if is_raining or not has_umbrella:
            print("Stay inside")
        role: distractor
        explanations:
          - body: |
              Using `or` is incorrect here because it would force you to stay inside if you don't have an umbrella, even if it's perfectly sunny outside!
  - type: block
    location:
      snippet: |-
        else:
          print("Go outside")
    choices:
      - snippet: |-
          else:
            print("Go outside")
        role: solution
        indent: 0
        explanations:
          - body: |
              This handles the fallback case where it is either not raining or you have an umbrella.
      - snippet: |-
          elif has_umbrella:
            print("Go outside")
        role: distractor
        explanations:
          - body: |
              Using `elif has_umbrella` is redundant and incomplete since it doesn't cover what happens when it is simply not raining.