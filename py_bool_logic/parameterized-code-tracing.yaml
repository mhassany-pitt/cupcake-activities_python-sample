runtime:
  language: python
  version: 3.10
statement: |
  Determine the output of the conditional statement under different parameter sets.
  Observe how the output changes when we vary the conditions `is_raining` and `has_umbrella`.
elements:
  - type: parameter
    location:
      snippet: "True"
      context: "is_raining = True"
    values: [True, False]
  - type: parameter
    location:
      snippet: "False"
      context: "has_umbrella = False"
    values: [True, False]
