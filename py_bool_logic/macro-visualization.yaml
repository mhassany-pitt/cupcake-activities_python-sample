$schema: https://learning-contents.org/schemas/macro-visualization/0.1.0
source: main.py
license: MIT
locale: en-US
id: mv_bool_logic
title: Logic Gates Visualization
description: A step-by-step visualization of complex boolean expressions.
authors:
  - first: Jane
    last: Foster
    email: jane@asgard.com
    affiliation: Stark Industries
pedagogy:
  activity: macro-visualization
  difficulty: novice
  prereq_topics: []
  topics:
    - boolean
    - logic
runtime:
  language: python
  version: 3
statement: |
  Step through the sequential evaluation of the logical expression `is_raining and not has_umbrella`.
  Pay attention to how the boolean variables are looked up and negated in the evaluation area.
elements:
  - settings:
      code: top
      heapHeight: 80
      stackHeight: 150
      width: 586
    init:
      - [setLine, 1]
      - [createOperator, and, l]
      - [createOperator, not, r]
      - [createFunction, print, 'print(a, ...)', -1, '-1']
      - [createFrame]
    steps:
      - [addValue, 'True', '0', bool]
      - [assign, is_raining]
      - [setLine, 2]
      - [addValue, 'False', '0', bool]
      - [assign, has_umbrella]
      - [setLine, 3]
      - [addValueFromVariable, is_raining, '0']
      - [addOperator, and, '1']
      - [evaluateOperator, '1']
      - [_conditionalJump, '@l4', '@l5']
      - [_label, l4]
      - [removeElement_, '0']
      - [addOperator, not, '0']
      - [addValueFromVariable, has_umbrella, '1']
      - [evaluateOperator, '0']
      - [_label, l5]
      - [_conditionalJump, '@l1', '@l2']
      - [_label, l1]
      - [setLine, 4]
      - [addFunction, print, '0', 1]
      - [addValue, Stay inside, 0/0/0, str]
      - [evaluateFunction, '0']
      - [goto, '@l3']
      - [_label, l2]
      - [setLine, 6]
      - [addFunction, print, '0', 1]
      - [addValue, Go outside, 0/0/0, str]
      - [evaluateFunction, '0']
      - [goto, '@l3']
      - [_label, l3]
    lines:
      - is_raining = True
      - has_umbrella = False
      - 'if is_raining and not has_umbrella:'
      - '  print("Stay inside")'
      - 'else:'
      - '  print("Go outside")'
      - ''